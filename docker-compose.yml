services:
  database:
    image: postgres:18-alpine
    container_name: serviceflow-database
    environment:
      POSTGRES_DB: serviceflow
      POSTGRES_USER: serviceflow
      POSTGRES_PASSWORD: serviceflow_dev
    ports:
      - "5432:5432"
    volumes:
      - serviceflow_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serviceflow -d serviceflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  serviceflow_postgres_data: